title: Services
seoData:
  seoTitle: Construction Services | White & White - San Clemente
  seoDescription: >-
    Explore the construction services offered by White & White Construction Inc.
    in San Clemente, CA. We specialize in additions, custom homes, remodels,
    decks, patios, and more.
blocks:
  - discriminant: singleHero
    value:
      bgImage: /src/assets/images/services/blocks/0/value/bgImage.jpg
      title: Construction Services
  - discriminant: twoCol
    value:
      heading: Expert Construction Services
      image: /src/assets/images/services/blocks/1/value/image.webp
      altTag: Remodel and additions
      imagePlacement: left
      imageSize: h-[500px]
      description: >
        ## **Family Owned & Operated in San Clemente, California**


        Over the past four decades, White & White Construction has been
        continually involved in a wide variety of construction projects, from
        small one-story homes to large estates and apartment buildings. Through
        the word of our gratified customers, we have built a first-rate
        reputation on the caliber of our expertise. We hire only trusted and
        reputable sub-contractors which we have longstanding relationships with.
        We do this so that we can meet, and often exceed, the excellent
        standards we hold ourselves to.
      button: {}
      colors: '#0069e5/5'
  - discriminant: serviceAreas
    value:
      title: Our Construction Services
      linkableLocations: true
      locations:
