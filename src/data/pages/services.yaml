          link: /additions
        - title: ADU
          link: /accessory-dwelling-unit
        - title: Carpentry
          link: /carpentry
        - title: Custom Carpentry
          link: /custom-carpentry
        - title: Custom Homes
          link: /custom-homes
        - title: Decks & Patios
          link: /decks-patios
        - title: Design Build
          link: /design-build
        - title: Door & Window Installation
          link: /door-window-installation
        - title: Finish Carpentry
          link: /finish-carpentry
        - title: Foundations
          link: /foundations
        - title: Framing
          link: /framing
        - title: Home Improvements
          link: /home-improvements
        - title: Remodels
          link: /remodels
        - title: Renovations
          link: /renovations
        - title: Siding
          link: /siding
      colTwoTitle: Submit a Quote! or Call Us!
      button:
        title: Get a Quote Today
        link: /#quote-form
