title: Home
seoData:
  seoTitle: 'White & White Construction: Orange County Remodeling & Custom Homes'
  seoDescription: >-
    White & White Construction Inc. is a leading contractor in Orange County,
    CA, specializing in home additions, custom homes, kitchen & bathroom
    remodeling, decks, and patios. Contact us today!
blocks:
  - discriminant: mainHero
    value:
      sliderImages:
        - image: /src/assets/images/home/blocks/0/value/sliderImages/0/image.jpg
          title: Your House Is More Than A House.
          description: It’s an investment, it’s a future, an inheritance. It's a home.
  - discriminant: twoCol
    value:
      heading: Welcome to White & White Construction
      image: /src/assets/images/home/blocks/1/value/image.jpg
      altTag: bathroom remodel
      imagePlacement: left
      imageSize: h-[500px]
      description: >
        We are a family-owned and operated team, located in San Clemente,
        California, catering to local homeowners seeking to increase the value
        of their home.
      button: {}
      colors: '#0069e5/5'
  - discriminant: serviceAreas
    value:
      title: Services
      linkableLocations: true
      locations:
        - title: Additions
          link: /additions
        - title: ADU
          link: /accessory-dwelling-unit
        - title: Carpentry
          link: /carpentry
        - title: Custom Carpentry
          link: /custom-carpentry
        - title: Custom Homes
          link: /custom-homes
        - title: Decks & Patios
          link: /decks-patios
        - title: Design Build
          link: /design-build
        - title: Door & Window Installation
          link: /door-window-installation
        - title: Finish Carpentry
          link: /finish-carpentry
        - title: Foundations
          link: /foundations
        - title: Framing
          link: /framing
        - title: Home Improvements
          link: /home-improvements
        - title: Remodels
          link: /remodels
        - title: Renovations
          link: /renovations
        - title: Siding
          link: /siding
      colTwoTitle: Submit a Quote! or Call Us!
      button:
        title: Get a Quote Today
        link: /#quote-form
  - discriminant: featuredImage
    value:
      image: /src/assets/images/home/blocks/3/value/image.jpg
      altTag: Remodels & Additions
      imagePosition: object-center
      imagePositionDesktop: md:object-top
      title: Remodels & Additions
      description: >-
        The best way to increase the value of your home is improving it and this
        is where you can begin!
  - discriminant: masonaryGallery
    value:
      title: Our Images
      images:
        - image: /src/assets/images/home/blocks/4/value/images/0/image.webp
          altTag: Living room remodel
        - image: /src/assets/images/home/blocks/4/value/images/1/image.webp
          altTag: Living room remodel with fire place and stairs
        - image: /src/assets/images/home/blocks/4/value/images/2/image.webp
          altTag: Kitchen remodel
        - image: /src/assets/images/home/blocks/4/value/images/3/image.webp
          altTag: Exterior remodel
        - image: /src/assets/images/home/blocks/4/value/images/4/image.webp
          altTag: Bathroom remodel
        - image: /src/assets/images/home/blocks/4/value/images/5/image.webp
          altTag: Accessory Dwelling Unit
        - image: /src/assets/images/home/blocks/4/value/images/6/image.webp
          altTag: Remodel and Additions
        - image: /src/assets/images/home/blocks/4/value/images/7/image.webp
          altTag: Stairway remodel
  - discriminant: reviewsSlider
    value:
      title: Hear from our customers
      logos: []
