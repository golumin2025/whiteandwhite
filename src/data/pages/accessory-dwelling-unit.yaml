title: ADU
seoData:
  seoTitle: Affordable ADU Construction in Orange County  | White and White Construction
  seoDescription: >-
    Build an Accessory Dwelling Unit (ADU) in Orange County with White and White
    Construction. Increase property value & rental income with expert planning,
    permits, and construction. Call today for a free consultation!
blocks:
  - discriminant: singleHero
    value:
      bgImage: /src/assets/images/accessory-dwelling-unit/blocks/0/value/bgImage.webp
      title: ADU Construction in Orange County
  - discriminant: twoCol
    value:
      heading: Build an Accessory Dwelling Unit (ADU) & Maximize Your Property’s Value
      image: /src/assets/images/accessory-dwelling-unit/blocks/1/value/image.webp
      altTag: Remodel and additions
      imagePlacement: left
      imageSize: h-[500px]
      description: >
        ## Unlock the Potential of Your Home with an ADU


        A new California law allows most single-family residences to add an
        Accessory Dwelling Unit (ADU), effectively transforming a property into
        a multi-unit investment. This law aims to combat California’s housing
        crisis by making homeownership more affordable and creating new rental
        opportunities.


        ### Full-Service ADU Construction – From Planning to Completion


        At White and White Construction, we handle everything from start to
        finish:

        ✅ Plans & Permits – We navigate city regulations and secure all
        necessary approvals.

        ✅ Expert Construction – Quality craftsmanship from foundation to finish.

        ✅ Financing Assistance – Guidance to help you explore funding options.
      button:
        label: Get a quote
        link: /#quote-form
      colors: '#0069e5/5'
  - discriminant: featuredImage
    value:
      image: /src/assets/images/accessory-dwelling-unit/blocks/2/value/image.webp
      altTag: bathroom remodel
      imagePosition: object-center
      imagePositionDesktop: md:object-center
      title: Why Build an ADU?
      description: "With high rental demand and low interest rates, ADUs provide homeowners with an excellent return on investment. Whether you’re looking for extra rental income, a space for family members, or an increase in property value, an ADU is a smart addition to your home.\n\nExample ADU Investment Breakdown:\n\t•\tSize: 600 sq. ft. addition\n\t•\tTotal Cost: $150,000 (including plans, permits, fees, and construction)\n\t•\tEstimated Rental Income: $1,500/month\n\t•\tMonthly Mortgage Payment: $1,152/month\n\t•\tProfit After Expenses: $348/month\n\t•\tAnnual Return: $4,176/year (excluding vacancies)\n\nWith this model, an ADU can provide a steady income stream while covering its own financing costs—making it a smart financial decision for many homeowners."
