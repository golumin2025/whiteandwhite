title: 'California Privacy Notice '
seoData:
  seoTitle: CA Privacy Notice | White & White Construction Inc.
  seoDescription: >-
    California residents: Understand your privacy rights and how White & White
    Construction Inc. collects, uses, and shares your personal information. Read
    our full Privacy Notice.
blocks:
  - discriminant: singleHero
    value:
      title: California Privacy Notice
  - discriminant: twoCol
    value:
      heading: California Privacy Notice
      altTag: California Privacy Notice
      imagePlacement: left
      imageSize: h-[500px]
      description: >
        This California Privacy Notice (the “Privacy Notice” or “Notice”)
        provides information to California residents about how White & White
        Construction Inc. (“White & White,” “we,” “us,” “our”) collects, uses,
        and discloses Personal Information. For more details about our privacy
        practices and any privacy rights you may have, please see our Privacy
        Policy.\

        \

        \**Information We Collect From California Residents**\

        We may collect information that personally identifies, relates to,
        describes, or is capable of being associated with you (“Personal
        Information”), including:


        - Identifiers – Name, mailing address, service address, email address,
        phone number, driver’s license or other government-issued ID, White &
        White account login credentials (if applicable).

        - Protected Classification Characteristics – Age, gender, marital
        status, ethnicity, and other characteristics as defined by California or
        federal law (if collected in a specific context, e.g., for demographic
        analysis of client base).

        - Demographic Information – Language preferences, household income (if
        collected for specific service offerings or marketing).

        - Commercial Information – Payment details, purchase history (of
        services), service subscriptions, contract terms, account status,
        property type and size (related to construction projects).

        - Internet or Network Activity – Browsing history on our website, IP
        address, cookies, device information (e.g., device IDs, OS
        specifications) when interacting with our online platforms.

        - Geolocation Data – Precise and non-precise location information from
        devices or website interactions (e.g., if using location-based features
        on our website).

        - Audio, Electronic, and Visual Data – Call recordings (if applicable
        for customer service or quality assurance), email correspondence, chat
        transcripts (if using website chat), testimonials, images of projects.

        - Employment-Related Information – Employer, occupation (if provided by
        clients or potential clients).

        - Education Information – Highest education level attained (if provided
        by clients or potential clients).

        - Inferences from Other Data – Preferences, interests, behavioral
        trends, credit scores (if relevant for financing options), and related
        insights.

        - Sensitive Personal Information – This may include social security
        numbers (if collected for specific legal/financial processes),
        government-issued IDs (for verification purposes), race, ethnicity,
        religion (if volunteered by clients), precise geolocation (if using
        specific location-based services), and account login credentials.\


        \**How We Use Personal Information**\

        We may use Personal Information for the following business purposes:


        - Account Management & Customer Support – Processing service requests,
        creating accounts (if applicable), providing project updates, and
        general customer support.

        - Marketing & Market Research – Sending promotional materials about our
        services, personalizing offers, and conducting analytics and trend
        research to improve our services and marketing efforts.

        - Billing & Collections – Managing payments for our services, account
        balances, and potentially reporting to credit agencies (if applicable
        for payment processing).

        - Customer Engagement – Administering surveys, contests, promotional
        events, and direct customer interactions related to our construction
        services.

        - Website & Service Optimization – Managing our website functionality,
        tracking user engagement, and utilizing analytics to improve our online
        presence and services.

        - Eligibility & Pricing – Assessing project requirements and determining
        applicable pricing for our construction services.

        - Service Development & Improvement – Enhancing our construction
        services, improving safety on job sites, and preventing misuse of our
        resources.

        - Business Operations – Evaluating and improving our business processes,
        fulfilling contractual obligations with clients, and enforcing our
        rights.

        - Legal & Compliance – Meeting regulatory requirements and industry
        standards relevant to construction businesses in California.

        - Security & Fraud Prevention – Protecting against unauthorized access
        to our systems, fraud, and other cyber threats.\
          \

        We may use Sensitive Personal Information for:


        - Government-Issued IDs – Client verification for contractual purposes
        and compliance with legal requirements.

        - Demographic Data (Race, Ethnicity, Religion) – For marketing insights
        and understanding our client base (only if explicitly collected and
        relevant to our business analysis).

        - Precise Geolocation – Delivering location-based services or offers (if
        applicable, e.g., showing service areas).

        - Account Credentials – Enabling secure access to client portals or
        accounts (if implemented) and for fraud prevention.


        \


        We may also use your information as disclosed at the time of collection,
        with your consent, or as otherwise permitted by California law.\

        \

        **Third-Party Selling and Sharing**\

        White & White Construction Inc. does not sell your Personal Information
        for monetary compensation. However, we may share certain Personal
        Information with third parties for purposes that could be classified as
        a “sale” under California law. These third parties may include service
        providers who assist us with marketing, website analytics, and other
        business operations. These third parties may use your information to
        provide these services to us and potentially for their own business
        activities, including marketing.\

        \

        **Data Retention**\

        We retain Personal Information for as long as necessary to fulfill the
        purposes outlined in this Notice, comply with legal obligations (such as
        record-keeping for construction permits and contracts), and support our
        business operations, including marketing and customer relationship
        management.
