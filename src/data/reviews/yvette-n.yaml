name: Yvette N.
content: >-
  During the last rains, a 2000 pound tree fell and hit our garage. The garage
  was very badly damaged to say the least. We called several construction
  companies. Some were arrogant. Others were very nice, but most did the same
  thing. They would come out, but they didn't want to give us an itemized bid.
  Most of them said, "Tell us what your insurance company is giving you, and
  we'll go by that. We use the same software, so it should be the same." Really?
  Well, that's not true. When they realized that wasn't going to work with us,
  they threw out a number, not an itemized bid.


  White and White came out. The owner was polite, professional, and listened to
  our concerns. He gave us a bid within 3 days. HE DID NOT ASK HOW MUCH OUR
  INSURANCE WAS GIVING US. He was the LOWEST of all the contractors. He was
  there for most of the work. His workers did not cuss and play loud music. His
  crew did the work quickly, well, and they were nice.


  I would truly give this company a chance to earn your business because good
  and professional contractors are not easy to find.
