name: Stacey E.
content: >-
  We had White and White Construction complete a room add on and kitchen
  remodel. Their attention to detail was so important when doing our remodel due
  to our home needing a lot of custom work done. Everyone of their crew was
  professional, on time, and extremely kind. They also left our home very clean
  (as clean as it can be) everyday when they left for the evening. I would
  highly recommend them and plan on using them again in the future.
