name: Denise B.
content: >-
  White and White Construction built our house from the ground up almost 10
  years ago in southwest san clemente. Brandon White (the owner) could not have
  worked harder, been more honest, or more amenable to my many changes. The
  house came out much better than expected and remains rock solid to this day. I
  had one very small problem almost 8 years after the construction was complete
  and Brandon hustled over here the same day that he found out and took care of
  it while refusing to take any money. He was a friend throughout the
  construction process and remains a friend to this day.
