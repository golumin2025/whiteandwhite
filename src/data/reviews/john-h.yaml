name: John H.
content: >-
  I was having my house painted, front door replaced and roof replaced. The trim
  and corbels above the garage were rotted, which needed to be fixed before the
  roof could be fully completed. I called Connor and he came right out to quote.
  He was able to replace the trim and corbels quickly so the rest of the roof
  job could be completed. Everything turned out great! Attention to detail -
  which was not done when the house was built in 1965. After the front door was
  replaced by another company, we were not satisfied with the interior casing as
  there were uneven gaps between the door and walls. The house is old and
  uneven. I called Connor again and he came out within a week to repair. He
  replaced the whole casing and worked some carpentry magic so there's no gap
  and the whole thing looks straight now. Very personable, reasonable rate.
  Great family business and local!
