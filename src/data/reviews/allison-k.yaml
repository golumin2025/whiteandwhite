name: Allison K.
content: >-
  We needed some work done on dry rot termite wood damage during our recent
  escrow process. I called White and White construction after having a very high
  dry rot repair bid from Reynold's Termite. White and White were not only;
  professional, honest, easy to communicate with, budget conscience, timely, but
  the inspector even signed off early on their work because they were doing such
  a great job. Thanks guys!
